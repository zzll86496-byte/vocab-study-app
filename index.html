<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>等价词库背单词</title>
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --red: #ef4444;
      --btn: #1d4ed8;
      --btn-hover: #1e40af;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, "Segoe UI", Arial, sans-serif; background: radial-gradient(circle at top, #0b1225, var(--bg)); color: var(--text); display: grid; place-items: center; padding: 24px; }
    .app { width: min(900px, 95vw); background: rgba(17,24,39,0.92); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 4px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .toolbar { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .list-picker { margin: 18px 0 14px; padding: 16px; border: 1px solid #3b82f6; border-radius: 14px; background: linear-gradient(135deg, #111c31, #13213b); box-shadow: 0 0 0 1px rgba(59,130,246,.08), 0 14px 34px rgba(0,0,0,.18); }
    .list-picker-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 12px; }
    .list-picker-title { color: #f8fafc; font-size: 16px; font-weight: 800; }
    .list-hint { color: #93c5fd; font-size: 13px; }
    .list-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
    .list-tab { text-align: center; padding: 10px 8px; border-color: #475569; background: #0b1224; font-size: 14px; font-weight: 700; }
    .list-tab:hover:not(:disabled) { border-color: #60a5fa; }
    .list-tab.active { background: #2563eb; border-color: #93c5fd; color: white; box-shadow: 0 6px 18px rgba(37,99,235,.32); }
    .list-tab.wrong-list { border-color: #7f1d1d; color: #fecaca; }
    .list-tab.wrong-list.active { background: #b91c1c; border-color: #fca5a5; color: white; box-shadow: 0 6px 18px rgba(185,28,28,.32); }
    .danger { color: #fecaca; border-color: #7f1d1d; }
    button:focus-visible { outline: 3px solid rgba(96,165,250,.45); outline-offset: 2px; }
    .status { font-size: 14px; color: var(--muted); }
    .progress { font-size: 14px; color: var(--muted); }
    .word-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px; background: #0b1224; }
    .word { font-size: 28px; margin: 0 0 16px; }
    .options { display: grid; gap: 10px; margin-top: 16px; }
    button { cursor: pointer; border: 1px solid var(--border); background: #1e293b; color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 16px; text-align: left; }
    button:hover:not(:disabled) { background: #24354f; }
    button:disabled { opacity: 0.75; cursor: default; }
    .opt-correct { background: #14532d !important; border-color: #22c55e !important; }
    .opt-wrong { background: #7f1d1d !important; border-color: #ef4444 !important; }
    .feedback { min-height: 26px; margin-top: 14px; font-weight: 600; }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    .btn-row { margin-top: 14px; display: flex; gap: 10px; }
    .primary { background: var(--btn); border-color: var(--btn-hover); }
    .primary:hover { background: var(--btn-hover); }
    .ghost { background: #0b1224; }
    .small { font-size: 14px; }
    .done { text-align: center; padding: 10px 0 4px; }
    .muted { color: var(--muted); }
    @media (max-width: 640px) {
      .word { font-size: 22px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .list-picker-head { align-items: flex-start; flex-direction: column; gap: 4px; }
      .list-grid { grid-template-columns: repeat(3, 1fr); }
      .status, .progress { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>等价词库背单词</h1>
    <div class="sub">2558 条词目（保留重复）· 每个选项仅显示中文释义</div>
    <div class="list-picker" aria-label="List 选择区">
      <div class="list-picker-head">
        <span class="list-picker-title">👇 先选择一个 List</span>
        <span class="list-hint" id="listHint"></span>
      </div>
      <div class="list-grid" id="listGrid" role="group" aria-label="选择学习 List"></div>
    </div>
    <div class="toolbar">
      <div class="status" id="status"></div>
      <div class="progress" id="progress"></div>
      <div class="status" id="counts"></div>
    </div>
    <section class="word-card" id="card"></section>
    <div class="btn-row">
      <button class="ghost small" id="resetBtn">清空当前 List 进度</button>
      <button class="ghost small" id="shuffleBtn">打乱当前 List 并重学</button>
      <button class="ghost small danger" id="clearWrongBtn" style="display:none">清空错题 List</button>
    </div>
    <p class="sub muted" style="margin-top:14px;">每个 List 分别保存进度；答错的词会自动加入“错题 List”，可随时集中复习。</p>
  </main>

    const STORAGE_KEY = 'vocab-progress-eq-2026-08-20-v5-2558-reparsed-ecdict';
    const LIST_SIZE = 300;
    const WRONG_LIST_ID = 'wrong';
    const LISTS = Array.from({ length: Math.ceil(VOCAB.length / LIST_SIZE) }, (_, index) => {
      const start = index * LIST_SIZE;
      const end = Math.min(start + LIST_SIZE, VOCAB.length);
      return { id: index, start, end, size: end - start };
    });

    const stateDefaults = {
      version: STORAGE_KEY,
      selectedList: 0,
      progressByList: {},
      wrongItems: [],
    };

    const card = document.getElementById('card');
    const statusEl = document.getElementById('status');
    const progressEl = document.getElementById('progress');
    const countsEl = document.getElementById('counts');
    const resetBtn = document.getElementById('resetBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const clearWrongBtn = document.getElementById('clearWrongBtn');
    const listGrid = document.getElementById('listGrid');
    const listHint = document.getElementById('listHint');
    let state = loadState();

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function isWrongList(listId = state.selectedList) {
      return listId === WRONG_LIST_ID;
    }

    function listIndices(listId, wrongItems = []) {
      if (listId === WRONG_LIST_ID) return Array.from(wrongItems);
      const list = LISTS[listId];
      return Array.from({ length: list.size }, (_, i) => list.start + i);
    }

    function makeProgress(listId, wrongItems = []) {
      return {
        order: listIndices(listId, wrongItems),
        idx: 0,
        correct: 0,
        wrong: 0,
        finished: false,
      };
    }

    function normalizeProgress(listId, saved, wrongItems) {
      const fresh = makeProgress(listId, wrongItems);
      if (!saved || !Array.isArray(saved.order)) return fresh;
      const allowed = new Set(fresh.order);
      const validOrder = saved.order.filter((index) => allowed.has(index));
      const missing = fresh.order.filter((index) => !validOrder.includes(index));
      const order = validOrder.concat(missing);
      if (order.length !== fresh.order.length) return fresh;
      return {
        order,
        idx: Math.max(0, Math.min(Number(saved.idx) || 0, order.length)),
        correct: Number.isFinite(saved.correct) ? saved.correct : 0,
        wrong: Number.isFinite(saved.wrong) ? saved.wrong : 0,
        finished: Boolean(saved.finished) && !missing.length,
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(stateDefaults));
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.version !== STORAGE_KEY) return JSON.parse(JSON.stringify(stateDefaults));
        const wrongItems = Array.from(new Set((parsed.wrongItems || []).filter(
          (index) => Number.isInteger(index) && index >= 0 && index < VOCAB.length
        )));
        const selectedList = parsed.selectedList === WRONG_LIST_ID
          ? WRONG_LIST_ID
          : Math.max(0, Math.min(Number(parsed.selectedList) || 0, LISTS.length - 1));
        const progressByList = {};
        for (const [key, saved] of Object.entries(parsed.progressByList || {})) {
          if (key === WRONG_LIST_ID) {
            progressByList[key] = normalizeProgress(WRONG_LIST_ID, saved, wrongItems);
            continue;
          }
          const listId = Number(key);
          if (Number.isInteger(listId) && listId >= 0 && listId < LISTS.length) {
            progressByList[listId] = normalizeProgress(listId, saved, wrongItems);
          }
        }
        return { version: STORAGE_KEY, selectedList, progressByList, wrongItems };
      } catch (e) {
        return JSON.parse(JSON.stringify(stateDefaults));
      }
    }

    function activeProgress() {
      const key = state.selectedList;
      if (!state.progressByList[key]) {
        state.progressByList[key] = makeProgress(key, state.wrongItems);
      }
      if (key === WRONG_LIST_ID) {
        state.progressByList[key] = normalizeProgress(key, state.progressByList[key], state.wrongItems);
      }
      return state.progressByList[key];
    }

    function currentListInfo() {
      if (isWrongList()) {
        return { id: WRONG_LIST_ID, size: state.wrongItems.length, label: '错题 List' };
      }
      const list = LISTS[state.selectedList];
      return { ...list, label: `List ${list.id + 1}` };
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function selectList(listId) {
      state.selectedList = listId;
      activeProgress();
      persistState();
      renderQuestion();
    }

    function populateListSelector() {
      LISTS.forEach((list) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'list-tab';
        button.dataset.listId = String(list.id);
        button.textContent = `List ${list.id + 1} · ${list.size}`;
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => selectList(list.id));
        listGrid.appendChild(button);
      });

      const wrongButton = document.createElement('button');
      wrongButton.type = 'button';
      wrongButton.className = 'list-tab wrong-list';
      wrongButton.dataset.listId = WRONG_LIST_ID;
      wrongButton.textContent = '错题 List · 0';
      wrongButton.setAttribute('aria-pressed', 'false');
      wrongButton.addEventListener('click', () => selectList(WRONG_LIST_ID));
      listGrid.appendChild(wrongButton);
    }

    function addWrongItem(index) {
      if (state.wrongItems.includes(index)) return;
      state.wrongItems.push(index);
      const review = state.progressByList[WRONG_LIST_ID];
      if (review) {
        review.order.push(index);
        review.finished = false;
      }
    }

    function shuffleChoices(correctIdx, count = 4) {
      const correct = VOCAB[correctIdx].meaning;
      const pool = new Set([correct]);
      const meanings = isWrongList()
        ? VOCAB.map((item) => item.meaning)
        : VOCAB.slice(LISTS[state.selectedList].start, LISTS[state.selectedList].end).map((item) => item.meaning);
      while (pool.size < count) {
        const pick = meanings[Math.floor(Math.random() * meanings.length)];
        if (pick === correct) continue;
        pool.add(pick);
      }
      const arr = Array.from(pool);
      shuffleInPlace(arr);
      return arr;
    }

    function renderStats() {
      const list = currentListInfo();
      const progress = activeProgress();
      statusEl.textContent = `当前：${list.label}（${list.size} 条）`;
      progressEl.textContent = `进度：${Math.min(progress.idx, list.size)} / ${list.size}`;
      countsEl.textContent = `正确：${progress.correct} / 错误：${progress.wrong}`;
      listHint.textContent = `${LISTS.length} 个普通 List · 错题 ${state.wrongItems.length} 条`;
      clearWrongBtn.style.display = isWrongList() && state.wrongItems.length ? 'inline-block' : 'none';
      listGrid.querySelectorAll('.list-tab').forEach((button) => {
        if (button.dataset.listId === WRONG_LIST_ID) {
          button.textContent = `错题 List · ${state.wrongItems.length}`;
        }
        const active = button.dataset.listId === String(state.selectedList);
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function renderQuestion() {
      const list = currentListInfo();
      const progress = activeProgress();

      if (isWrongList() && list.size === 0) {
        card.innerHTML = `
          <div class="done">
            <h2>错题 List 还是空的 🎉</h2>
            <p class="sub">在普通 List 中答错的单词，会自动收集到这里。</p>
          </div>
        `;
        renderStats();
        return;
      }

      if (progress.finished || progress.idx >= list.size) {
        card.innerHTML = `
          <div class="done">
            <h2>${list.label} 已完成 ✅</h2>
            <p class="sub">本组累计正确 <strong>${progress.correct}</strong>，错误 <strong>${progress.wrong}</strong>。</p>
            <button class="primary" id="restartBtn">重新学习当前 List</button>
          </div>
        `;
        card.querySelector('#restartBtn').addEventListener('click', () => {
          state.progressByList[state.selectedList] = makeProgress(state.selectedList, state.wrongItems);
          persistState();
          renderQuestion();
        });
        renderStats();
        return;
      }

      const currentIndex = progress.order[progress.idx];
      const current = VOCAB[currentIndex];
      const options = shuffleChoices(currentIndex);

      card.innerHTML = `
        <div>
          <p class="status">${list.label} · 第 ${progress.idx + 1} 题</p>
          <h2 class="word">${current.word}</h2>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
          <div class="btn-row">
            <button id="nextBtn" class="primary" style="display:none">下一题</button>
          </div>
        </div>
      `;

      const optionsEl = card.querySelector('#options');
      const feedback = card.querySelector('#feedback');
      const nextBtn = card.querySelector('#nextBtn');

      options.forEach((text) => {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.type = 'button';
        btn.addEventListener('click', () => handleChoose(btn, text, current.meaning, currentIndex, feedback, nextBtn));
        optionsEl.appendChild(btn);
      });

      renderStats();
      nextBtn.addEventListener('click', renderQuestion);
    }

    function handleChoose(btn, selected, correct, currentIndex, feedback, nextBtn) {
      const progress = activeProgress();
      const list = currentListInfo();
      const buttons = Array.from(card.querySelectorAll('#options button'));
      buttons.forEach((button) => (button.disabled = true));

      if (selected === correct) {
        btn.classList.add('opt-correct');
        feedback.textContent = '✓ 正确';
        feedback.className = 'feedback ok';
        progress.correct += 1;
      } else {
        btn.classList.add('opt-wrong');
        addWrongItem(currentIndex);
        feedback.textContent = '✗ 错误 · 已加入错题 List';
        feedback.className = 'feedback bad';
        progress.wrong += 1;
        const correctBtn = buttons.find((button) => button.textContent === correct);
        if (correctBtn) correctBtn.classList.add('opt-correct');
      }

      progress.idx += 1;
      if (progress.idx >= list.size) progress.finished = true;
      persistState();
      nextBtn.style.display = 'inline-block';
      nextBtn.disabled = false;
      renderStats();
    }

    resetBtn.addEventListener('click', () => {
      const list = currentListInfo();
      if (!confirm(`确定要清空${list.label}的学习进度吗？`)) return;
      state.progressByList[state.selectedList] = makeProgress(state.selectedList, state.wrongItems);
      persistState();
      renderQuestion();
    });

    shuffleBtn.addEventListener('click', () => {
      const list = currentListInfo();
      if (!confirm(`确定要打乱${list.label}并从头开始吗？`)) return;
      const progress = makeProgress(state.selectedList, state.wrongItems);
      shuffleInPlace(progress.order);
      state.progressByList[state.selectedList] = progress;
      persistState();
      renderQuestion();
    });

    clearWrongBtn.addEventListener('click', () => {
      if (!confirm('确定要删除错题 List 中的全部单词吗？')) return;
      state.wrongItems = [];
      state.progressByList[WRONG_LIST_ID] = makeProgress(WRONG_LIST_ID, []);
      persistState();
      renderQuestion();
    });

    populateListSelector();
    renderQuestion();
  </script>
</body>
</html>
